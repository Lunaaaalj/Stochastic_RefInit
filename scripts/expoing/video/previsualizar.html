<!-- Escenario del video. Abierto tal cual, es la previsualización (barra de tiempo,
     música y saltos por escena). Con ?render lo usa renderizar.py: 1920 × 1080 a 1:1,
     sin controles, y cada cuadro se pide con window.__video.tick(t). Con ?guia=E3 se
     pinta encima el teleprompter del video guía de esa escena (video_guia.py). -->
